        <path d="M53 328H144V338H53Z"/>
        <use href="#column" x="58" y="257"/>
        <use href="#column" x="89" y="257"/>
        <use href="#column" x="120" y="257"/>
      </g>
      <path d="M61 235L99 222L135 235Z" fill="#354f47"/>

      <g fill="url(#stone)" stroke="#bfac77" stroke-width="1">
        <path d="M365 330L374 251H419L430 330Z"/>
        <path d="M377 251L383 201H409L417 251Z"/>
        <path d="M381 201V187H412V201Z"/>
        <path d="M386 187V168H407V187Z"/>
        <path d="M382 168L396 154L411 168Z"/>
        <path d="M369 251H424V259H369ZM362 330H433V340H362Z"/>
      </g>
      <path d="M393 175H400V184H393ZM391 213H400V230H391Z"
