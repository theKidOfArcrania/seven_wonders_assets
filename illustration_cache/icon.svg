               L90 431H83L69 387H62Z"/>
      <path d="M163 382C147 382 138 392 138 407S147 432 163 432
               S188 422 188 407S179 382 163 382Z
               M163 388C154 388 150 395 150 407S154 426 163 426
               S176 419 176 407S172 388 163 388Z"/>
      <path d="M192 383H208L231 415V387H225V383H244V387H238V431H231
               L205 395V427H211V431H192V427H198V387H192Z"/>
      <path d="M249 383H271C288 383 297 392 297 407S288 431 271 431
               H249V427H255V387H249Z
               M266 389V425H271C281 425 285 419 285 407S281 389 271 389Z"/>
      <path d="M302 383H341L342 397H337L334 389H319V403H330V398H335V414
               H330V409H319V425H335L339 416H344L342 431H302V427H308V387H302Z"/>
      <path d="M348 383H371C385 383 391 388 391 397
               C391 403 387 408 380 409L390 425L396 427V431H381
               L368 411H365V427H371V431H348V427H354V387H348Z
               M365 389V405H370C377 405 380 403 380 397S377 389 370 389Z"/>
      <path d="M431 384H436V398H431C429 391 425 388 419 388
               C413 388 410 390 410 394C410 398 414 400 422 403
               C433 407 438 411 438 418C438 427 431 432 420 432
               C414 432 409 430 405 428L403 431H398V415H403
               C405 423 411 426 419 426C425 426 428 424 428 420
               C428 416 424 414 416 411C405 407 400 403 400 396
               C400 387 407 382 418 382C423 382 427 384 430 386Z"/>
    </g>

    <g fill="none" stroke="#a68b54" stroke-width="1.5" opacity=".7">
      <path d="M94 459H222M290 459H418"/>
      <path d="M236 459H245L256 448L267 459H276
               M245 459L256 470L267 459"/>
    </g>
  </g>

  <rect x="16" y="16" width="480" height="480" rx="76"
        fill="none" stroke="#382d23" stroke-width="10"/>
  <rect x="16" y="16" width="480" height="480" rx="76"
        fill="none" stroke="url(#gold)" stroke-width="6"/>
  <rect x="24" y="24" width="464" height="464" rx="68"
        fill="none" stroke="#c8aa63" stroke-width="1" opacity=".65"/>
</svg>
