<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024"
     viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">7 Wonders</title>
  <desc id="description">A monumental gold seven above a gold WONDERS wordmark,
    framed by ancient architecture, a setting sun, and a deep teal sky.</desc>
  <defs>
    <linearGradient id="sky" x2="0.2" y2="1">
      <stop stop-color="#081e2b"/>
      <stop offset=".55" stop-color="#174b52"/>
      <stop offset="1" stop-color="#527064"/>
    </linearGradient>
    <radialGradient id="sunlight" cx=".5" cy=".43" r=".55">
      <stop stop-color="#f8dfa0" stop-opacity=".66"/>
      <stop offset=".55" stop-color="#d4b16b" stop-opacity=".12"/>
      <stop offset="1" stop-color="#d4b16b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1=".1" y1="0" x2=".8" y2="1">
      <stop stop-color="#fff3ba"/>
      <stop offset=".24" stop-color="#edca72"/>
      <stop offset=".48" stop-color="#b98232"/>
      <stop offset=".64" stop-color="#f7dc8d"/>
      <stop offset="1" stop-color="#9d6224"/>
    </linearGradient>
    <linearGradient id="bevel" x2="0" y2="1">
      <stop stop-color="#fff5c3"/>
      <stop offset=".5" stop-color="#e7bc65"/>
      <stop offset="1" stop-color="#a2682d"/>
    </linearGradient>
    <linearGradient id="stone" x2=".8" y2="1">
      <stop stop-color="#bca978"/>
      <stop offset="1" stop-color="#516258"/>
    </linearGradient>
    <linearGradient id="base" x2="0" y2="1">
      <stop stop-color="#102f35" stop-opacity="0"/>
      <stop offset=".4" stop-color="#0b252d" stop-opacity=".94"/>
      <stop offset="1" stop-color="#071b26"/>
    </linearGradient>
    <clipPath id="frame">
      <rect x="16" y="16" width="480" height="480" rx="76"/>
    </clipPath>
    <g id="column">
      <path d="M0 0H19V7H16L15 69H18V75H1V69H4L3 7H0Z"
            fill="url(#stone)" stroke="#d4bf8a" stroke-width="1"/>
      <path d="M7 10V65M11 10V65" fill="none" stroke="#304c48"
            stroke-width="2" opacity=".65"/>
    </g>
  </defs>

  <g clip-path="url(#frame)">
    <path fill="url(#sky)" d="M0 0H512V512H0Z"/>
    <path fill="url(#sunlight)" d="M0 0H512V512H0Z"/>
    <circle cx="260" cy="210" r="141" fill="#d8c28a" opacity=".07"/>
    <circle cx="260" cy="210" r="126" fill="none" stroke="#d7c38d"
            stroke-width="1" opacity=".22"/>
    <circle cx="260" cy="210" r="117" fill="none" stroke="#d7c38d"
            stroke-width="1" opacity=".11"/>
    <path d="M260 57V67M260 353V363M107 210H117M403 210H413
             M152 102L159 109M361 311L368 318
             M152 318L159 311M361 109L368 102"
          fill="none" stroke="#e1c98b" stroke-width="2" opacity=".35"/>

    <!-- Quiet architectural silhouettes leave the numeral as the focal point. -->
    <g stroke-linejoin="round">
      <path d="M18 331L100 203L181 331Z" fill="#8d936c"/>
      <path d="M100 203L119 331H181Z" fill="#566e5c"/>
      <path d="M39 299H114M52 279H111M65 259H108M78 239H105"
