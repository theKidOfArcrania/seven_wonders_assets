    <path d="M24 362Q135 347 213 366T404 361T497 365"
          fill="none" stroke="#baaa70" stroke-width="2" opacity=".4"/>
    <path fill="url(#base)" d="M16 298H496V496H16Z"/>

    <!-- The offset solid extrusion and inset facets do not require SVG filters. -->
    <path d="M151 96H370V149L257 345H180L288 158H151Z"
          fill="#04171d" stroke="#04171d" stroke-width="13"
          stroke-linejoin="round" transform="translate(0 9)" opacity=".8"/>
    <path d="M151 96H370V149L257 345H180L288 158H151Z"
          fill="#845023" stroke="#452e1e" stroke-width="3"
          stroke-linejoin="round" transform="translate(0 5)"/>
    <path d="M151 96H370V149L257 345H180L288 158H151Z"
          fill="url(#gold)" stroke="#f4d893" stroke-width="2"
          stroke-linejoin="round"/>
    <path d="M151 96H370L358 108H163V146L151 158Z"
          fill="#fff0b3"/>
    <path d="M163 108H358V145L250 333H200L308 146H163Z"
          fill="url(#bevel)"/>
    <path d="M358 108L370 96V149L257 345L250 333L358 145Z"
          fill="#9a642a"/>
    <path d="M180 345L200 333H250L257 345Z" fill="#f3ce7b"/>
    <path d="M163 146H308L288 158H151Z" fill="#b27c32"/>
    <path d="M200 333L308 146" fill="none" stroke="#fff1b1"
          stroke-width="2" opacity=".85"/>
    <path d="M168 113H349" fill="none" stroke="#fff6cd"
          stroke-width="2" opacity=".5"/>

    <path d="M67 363H217M295 363H445" fill="none"
          stroke="#ad8c4c" stroke-width="1"/>
    <path d="M245 363L256 357L267 363L256 369Z" fill="url(#gold)"/>

    <!-- Outlined Roman capitals keep the wordmark independent of local fonts. -->
    <g fill="url(#bevel)" stroke="#493923" stroke-width="1"
       fill-rule="evenodd" aria-label="WONDERS">
      <path d="M62 383H83V387H78L87 418L97 389L96 387H91V383H111V387H106
