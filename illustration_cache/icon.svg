      <path d="M434 293Q438 265 453 268M460 267Q460 239 478 244
               M485 240Q486 214 502 222"
            fill="none" stroke="#8f9a66" stroke-width="5"/>
    </g>

    <path d="M16 354Q104 334 187 351T347 350T496 340V496H16Z"
